<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程進度甘特圖</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; }
        .chart-container { height: 600px; width: 100%; }
        .status-pill { padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
        .status-progress { background-color: #fef3c7; color: #d97706; }
        .status-done { background-color: #d1fae5; color: #059669; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">📊 工程進度甘特圖</h1>
                <p class="text-gray-500 text-sm">追蹤各項作業之計畫與實際執行進度</p>
            </div>
            <a href="main.html" class="bg-white border border-gray-300 px-4 py-2 rounded-lg shadow-sm hover:bg-gray-50 transition text-sm">⬅ 返回報工頁面</a>
        </header>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">開始日期</label>
                <input type="date" id="startDate" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">結束日期</label>
                <input type="date" id="endDate" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
            </div>
            <button onclick="fetchReports()" class="bg-purple-600 text-white px-6 py-1.5 rounded-md hover:bg-purple-700 transition text-sm font-medium">執行查詢</button>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
            <div class="chart-container">
                <canvas id="ganttChart"></canvas>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 border-b border-gray-100 text-gray-500">
                    <tr>
                        <th class="px-6 py-4 font-semibold">作業項目</th>
                        <th class="px-6 py-4 font-semibold">位置 (棟別/樓層)</th>
                        <th class="px-6 py-4 font-semibold">工作描述</th>
                        <th class="px-6 py-4 font-semibold">計畫時程</th>
                        <th class="px-6 py-4 font-semibold text-[#4a148c]">實際進度</th>
                        <th class="px-6 py-4 font-semibold text-center">狀態</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { SUPABASE_CONFIG } from './config.js';
        import { createClient } from 'https://esm.sh/@supabase/supabase-js';
        
        const supabase = createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.KEY);
        let chartInstance = null;

        // 初始化日期
        const today = new Date();
        const lastMonth = new Date();
        lastMonth.setMonth(today.getMonth() - 1);
        document.getElementById('startDate').value = lastMonth.toISOString().split('T')[0];
        document.getElementById('endDate').value = new Date(today.getFullYear(), today.getMonth() + 2, 0).toISOString().split('T')[0];

        window.onload = fetchReports;

        async function fetchReports() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            // 🚀 修正後的查詢語法
            const { data, error } = await supabase
                .from('daily_reports')
                .select(`
                    *,
                    report_work_items!inner(
                        description,
                        plan_start_date,
                        plan_end_date,
                        actual_start_date,
                        actual_end_date
                    )
                `)
                .or('plan_start_date.not.is.null,plan_end_date.not.is.null,actual_start_date.not.is.null,actual_end_date.not.is.null', { 
                    foreignTable: 'report_work_items' 
                })
                .order('actual_start_date', { 
                    foreignTable: 'report_work_items', 
                    ascending: true 
                });

            if (error) { console.error("Error fetching data:", error); return; }

            // 🚀 資料扁平化處理
            const flatData = [];
            if (data) {
                data.forEach(report => {
                    report.report_work_items.forEach(item => {
                        flatData.push({
                            ...report,
                            description: item.description,
                            plan_start_date: item.plan_start_date,
                            plan_end_date: item.plan_end_date,
                            actual_start_date: item.actual_start_date,
                            actual_end_date: item.actual_end_date
                        });
                    });
                });
            }

            renderGantt(flatData);
            renderTable(flatData);
        }

    function renderGantt(reports) {
    const ctx = document.getElementById('ganttChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    const todayStr = new Date().toISOString().split('T')[0];

    // 動態高度計算
    const container = document.querySelector('.chart-container');
    const taskCount = reports.length || 1;
    container.style.height = `${Math.max(500, taskCount * 70)}px`;

    // 🚀 插件 1：今日紅線
    const todayLinePlugin = {
        id: 'todayLine',
        afterDatasetsDraw(chart) {
            const { ctx, scales: { x, y } } = chart;
            const xPos = x.getPixelForValue(new Date(todayStr));
            if (xPos >= x.left && xPos <= x.right) {
                ctx.save();
                ctx.beginPath(); ctx.lineWidth = 2; ctx.strokeStyle = '#ef4444';
                ctx.setLineDash([6, 4]);
                ctx.moveTo(xPos, y.top); ctx.lineTo(xPos, y.bottom);
                ctx.stroke();
                ctx.fillStyle = '#ef4444'; ctx.font = 'bold 12px sans-serif';
                ctx.fillText('今日', xPos + 5, y.top + 15);
                ctx.restore();
            }
        }
    };

    // 🚀 插件 2：在橫柱頭尾顯示日期
    const barDateLabels = {
        id: 'barDateLabels',
        afterDatasetsDraw(chart) {
            const { ctx, data, scales: { x, y } } = chart;
            
            chart.data.datasets.forEach((dataset, datasetIndex) => {
                const meta = chart.getDatasetMeta(datasetIndex);
                meta.data.forEach((bar, index) => {
                    const val = dataset.data[index].x;
                    if (!val || val.length < 2) return;

                    const startDate = val[0];
                    const endDate = val[1];
                    
                    ctx.save();
                    ctx.fillStyle = datasetIndex === 0 ? '#6d28d9' : '#1e293b'; // 計畫用紫色，實際用深色
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';

                    // 繪製開始日期 (左端)
                    if (startDate) {
                        const startX = bar.x; // 橫條左側像素
                        const startY = bar.y;
                        ctx.fillText(startDate.substring(5), bar.base - 20, startY + 4); 
                    }

                    // 繪製結束日期 (右端)
                    if (endDate) {
                        const endX = bar.x; // 橫條右側像素
                        const endY = bar.y;
                        ctx.fillText(endDate.substring(5), endX + 20, endY + 4);
                    }
                    ctx.restore();
                });
            });
        }
    };

    const datasets = [
        {
            label: '計畫時程',
            data: reports.map(r => ({ x: [r.plan_start_date, r.plan_end_date], y: r.description })),
            backgroundColor: 'rgba(167, 139, 250, 0.4)',
            borderColor: '#8b5cf6', borderWidth: 1, borderRadius: 4,
            barPercentage: 0.7 
        },
        {
            label: '實際進度',
            data: reports.map(r => ({ x: [r.actual_start_date, r.actual_end_date], y: r.description })),
            backgroundColor: 'rgba(74, 20, 140, 0.8)',
            borderColor: '#4a148c', borderWidth: 1, borderRadius: 4,
            barPercentage: 0.4 
        }
    ];

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: { datasets },
        plugins: [todayLinePlugin, barDateLabels], // 🚀 啟用兩個插件
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            layout: {
                padding: { left: 20, right: 40 } // 🚀 預留空間給頭尾日期文字
            },
            scales: {
                x: {
                    type: 'time', position: 'top',
                    time: { unit: 'day', displayFormats: { day: 'MM/dd' } },
                    min: document.getElementById('startDate').value,
                    max: document.getElementById('endDate').value,
                    grid: { color: '#f1f5f9' }
                },
                y: { 
                    grid: { display: false },
                    ticks: { font: { weight: 'bold', size: 12 } }
                }
            },
            plugins: {
                legend: { position: 'top' }
            }
        }
    });
}

        function renderTable(reports) {
            const tbody = document.getElementById('taskTableBody');
            tbody.innerHTML = reports.map(r => `
                <tr class="hover:bg-gray-50 border-b border-gray-50">
                    <td class="px-6 py-4">
                        <div class="font-bold text-gray-800">${r.category || '-'}</div>
                        <div class="text-[11px] text-gray-500">${r.sub_category || '-'}</div>
                    </td>
                    <td class="px-6 py-4 font-bold text-purple-700">
                        ${r.buildings?.join('') || ''}-${r.floors?.join('') || ''}
                    </td>
                    <td class="px-6 py-4 text-gray-700 font-medium">
                        ${r.description || '-'}
                    </td>
                    <td class="px-6 py-4 text-[11px] text-gray-400 font-mono">
                        ${r.plan_start_date || '--'} ~ ${r.plan_end_date || '--'}
                    </td>
                    <td class="px-6 py-4 text-[11px] text-[#4a148c] font-bold font-mono">
                        ${r.actual_start_date || '未開始'} ~ ${r.actual_end_date || '--'}
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="status-pill ${r.status === '完成' ? 'status-done' : 'status-progress'}">
                            ${r.status || '施工中'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }
        
        window.fetchReports = fetchReports;
    </script>
</body>
</html>
